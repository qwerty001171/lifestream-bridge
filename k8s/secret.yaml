apiVersion: v1
kind: Secret
metadata:
  name: lifestream-bridge-secrets
  namespace: billing
  labels:
    app: lifestream-bridge
type: Opaque
# Base64-encoded values. To encode: echo -n 'value' | base64
# Replace these placeholders with real values before deploying.
stringData:
  APP_KEY: "base64:REPLACE_WITH_GENERATED_APP_KEY"
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  LIFESTREAM_KEY: "REPLACE_WITH_LIFESTREAM_API_KEY"
  BILLING_REGION_A_KEY: "REPLACE_WITH_REGION_A_API_KEY"
  BILLING_REGION_B_KEY: "REPLACE_WITH_REGION_B_API_KEY"
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"

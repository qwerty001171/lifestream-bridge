apiVersion: v1
kind: Service
metadata:
  name: lifestream-bridge
  namespace: billing
  labels:
    app: lifestream-bridge
spec:
  type: ClusterIP
  selector:
    app: lifestream-bridge
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# Optional: Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lifestream-bridge-ingress
  namespace: billing
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: lifestream-bridge.internal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lifestream-bridge
                port:
                  number: 80

apiVersion: v1
kind: ConfigMap
metadata:
  name: lifestream-bridge-config
  namespace: billing
  labels:
    app: lifestream-bridge
data:
  APP_NAME: "lifestream-bridge"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://lifestream-bridge.billing.svc.cluster.local"

  LOG_CHANNEL: "stack"
  LOG_LEVEL: "warning"

  DB_CONNECTION: "mysql"
  DB_HOST: "mysql.billing.svc.cluster.local"
  DB_PORT: "3306"
  DB_DATABASE: "billing_service"
  DB_USERNAME: "billing"

  CACHE_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"
  SESSION_DRIVER: "redis"

  REDIS_HOST: "redis.billing.svc.cluster.local"
  REDIS_PORT: "6379"

  LIFESTREAM_URL: "https://api.lifestream.example.com"
  LIFESTREAM_TIMEOUT: "30"
  LIFESTREAM_RATE_LIMIT: "10"
  LIFESTREAM_RETRIES: "3"
  LIFESTREAM_RETRY_DELAY: "500"

  BILLING_REGION_A_URL: "http://billing-a.isp.internal/api"
  BILLING_REGION_B_URL: "http://billing-b.isp.internal/api"

  BILLING_PAGE_LIMIT: "1000"
